<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalet Suizo | Alta Cocina y Salón de eventos en Bogotá</title>
<meta name="description" content="La fusión perfecta entre la tradición culinaria suiza y el alma de los ingredientes colombianos. Alta cocina y salón de eventos exclusivo en Bogotá.">
<meta name="theme-color" content="#0A1C16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --c-ink:#0A1C16;
  --c-paper:#FDFBF7;
  --c-gold:#C4A975;
  --c-muted:rgba(10,28,22,.58);
  --t-sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --gutter:clamp(1.25rem,4vw,3rem);
  --cw:78rem;
  --edge:max(var(--gutter),calc((100vw - var(--cw)) / 2));
  --e-apple:cubic-bezier(.25,.1,.25,1);
}
*,::after,::before{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;padding:0;width:100%;max-width:100%;
  overflow-x:hidden;
  background:var(--c-paper);color:var(--c-ink);
  font-family:var(--t-sans);font-size:1rem;line-height:1.55;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
img,svg,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2{margin:0;font-family:var(--t-sans);font-weight:600;line-height:1.06;letter-spacing:-.03em}

/* ============================================================
   SCROLL VIDEO
   ============================================================ */
.scrolly{--story-height:250vh;position:relative;width:100%;height:var(--story-height);background:#050609}
.scrolly__sticky{position:sticky;top:0;width:100%;height:100vh;height:100svh;height:100dvh;min-height:0;overflow:hidden;isolation:isolate;background:#050609}
.scrolly__media{position:absolute;inset:0;z-index:-2;overflow:hidden;background:#050609;pointer-events:none}
.scrolly__video{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;transform:translate3d(0,0,0) scale(1.015);backface-visibility:hidden;background:#050609;pointer-events:none;filter:none;opacity:1;mix-blend-mode:normal}
.scrolly__sticky::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(5,6,9,.34),rgba(5,6,9,.08) 56%,rgba(5,6,9,.24)),linear-gradient(180deg,rgba(5,6,9,.12),transparent 24%,transparent 70%,rgba(5,6,9,.28))}
.scrolly__content{position:relative;width:100%;height:100%}
.scrolly__scene{position:absolute;inset:0;display:flex;flex-direction:column;gap:1rem;align-items:center;justify-content:center;text-align:center;padding:2.5rem var(--edge) 5rem;opacity:0;visibility:hidden;transform:translate3d(0,24px,0);will-change:opacity,transform;pointer-events:none;transition:none}
.scrolly__scene a{pointer-events:auto}
.scrolly__logo{position:relative;display:grid;place-items:center;width:clamp(6.5rem,10vw,8.75rem);aspect-ratio:1;border-radius:clamp(1.15rem,2vw,1.85rem);overflow:hidden;background:#fff;box-shadow:0 12px 34px rgba(10,28,22,.12)}
.scrolly__logo img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.scrolly__splash-name{margin:.55rem 0 0;color:#FDFBF7;font-size:clamp(2.5rem,5vw,4.5rem);line-height:.98;letter-spacing:-.055em;font-weight:600;text-shadow:0 2px 24px rgba(0,0,0,.42)}
.scrolly__copy{width:min(100%,42rem);color:#FDFBF7;text-shadow:0 2px 24px rgba(0,0,0,.3)}
.scrolly__title{max-width:12ch;margin:0 0 1rem;color:#FDFBF7;font-size:clamp(2.6rem,5.2vw,5.75rem);font-weight:600;line-height:.98;letter-spacing:-.05em;text-shadow:0 2px 28px rgba(0,0,0,.4)}

.btn{display:inline-flex;align-items:center;gap:.55rem;padding:.85rem 1.55rem;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:linear-gradient(180deg,#DBC69C,#C4A975);color:var(--c-ink);font-size:.9rem;font-weight:500;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -8px rgba(196,169,117,.55);transition:transform .3s var(--e-apple),box-shadow .3s var(--e-apple)}
.btn:active{transform:scale(.97);transition-duration:.12s}
.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 14px 32px -10px rgba(196,169,117,.7)}
.btn-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#3e3e3e;flex-shrink:0;transition:transform .25s}
.btn-icon svg{width:13px;height:13px;color:#f5f5f5}
.btn:hover .btn-icon{transform:scale(1.1)}

/* Escena 0 y 3 centradas */
.scrolly__scene[data-scene="0"],
.scrolly__scene[data-scene="3"]{align-items:center;justify-content:center;text-align:center}
.scrolly__scene[data-scene="3"] .scrolly__copy{margin-left:auto;margin-right:auto;text-align:center}
.scrolly__scene[data-scene="3"] .scrolly__title{margin-left:auto;margin-right:auto;text-align:center}

@media (max-width:768px){
  .scrolly__scene{padding:5.25rem var(--gutter) 4.5rem}
  .scrolly__title{max-width:11ch;font-size:clamp(2.3rem,8.7vw,3.25rem);line-height:.99}
  .scrolly__splash-name{font-size:clamp(2.5rem,8.6vw,3.45rem);line-height:1}
  .scrolly__logo{width:clamp(7rem,25vw,9rem);border-radius:1.35rem}
  .scrolly__copy{width:min(100%,27rem)}
}
@media (max-width:480px){
  .scrolly__title{font-size:clamp(2.15rem,9vw,2.8rem)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<section class="scrolly" id="inicio" aria-label="Presentación">
  <div class="scrolly__sticky">
    <div class="scrolly__media" aria-hidden="true">
      <video id="scrollyVideo" class="scrolly__video" muted playsinline preload="metadata">
        <source src="https://organicbionatural.com/wp-content/uploads/2026/10/Scroll2.mp4" type="video/mp4">
      </video>
    </div>

    <div class="scrolly__content">
      <div class="scrolly__scene" data-scene="0">
        <div class="scrolly__logo" aria-hidden="true">
          <img src="https://images.unsplash.com/photo-1541529086526-db283c563270?w=400&q=80" alt="Chalet Suizo">
        </div>
        <h1 class="scrolly__splash-name">Chalet Suizo</h1>
      </div>

      <div class="scrolly__scene" data-scene="1">
        <div class="scrolly__copy">
          <h2 class="scrolly__title">Tradición suiza, alma colombiana.</h2>
        </div>
      </div>

      <div class="scrolly__scene" data-scene="2">
        <div class="scrolly__copy">
          <h2 class="scrolly__title">Una experiencia inolvidable.</h2>
        </div>
      </div>

      <div class="scrolly__scene" data-scene="3">
        <div class="scrolly__copy">
          <h2 class="scrolly__title">Te esperamos en casa.</h2>
          <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem;margin-top:1.75rem">
            <a href="#reservas" class="btn">
              <span class="btn-text">Reservar mesa</span>
              <span class="btn-icon">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h11M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  'use strict';
  var n = function(v,a,b){return Math.max(a,Math.min(b,v))};
  var c = document.querySelector('.scrolly');
  var l = document.getElementById('scrollyVideo');
  var d = Array.prototype.slice.call(document.querySelectorAll('.scrolly__scene'));
  if(!c||!l||!d.length) return;

  var q=0, S=false, T=0, F=false, pending=false, target=0;

  function Y(){ q = Number.isFinite(l.duration)?l.duration:0; S = q>0 && l.readyState>=1; }
  l.addEventListener('loadedmetadata', function(){ Y(); try{ l.pause(); l.currentTime=0; }catch(e){} }, {once:true});
  l.addEventListener('durationchange', Y);
  l.addEventListener('loadeddata', Y);
  l.addEventListener('canplay', Y);
  try{ l.load(); }catch(e){}

  function j(){ var r=c.getBoundingClientRect(), m=Math.max(1,c.offsetHeight-innerHeight); T = n(-r.top/m,0,1); }

  function z(){
    var sideShift  = Math.min(124, Math.max(46, window.innerWidth  * 0.12));
    var belowShift = Math.min(100, Math.max(50, window.innerHeight * 0.11));

    d.forEach(function(el,o){
      var s=0,x=0,y=0;
      if(o===0){
        if(T < 0.045){ s=1; }
        else if(T < 0.115){ s = 1 - (T - 0.045)/0.07; }
        else { s=0; }
      }
      else if(o===1){
        if(T < 0.075){ s=0; x=-sideShift; }
        else if(T < 0.155){ var u=(T-0.075)/0.08; s=u; x=-sideShift*(1-u); }
        else if(T < 0.375){ s=1; x=0; }
        else if(T < 0.465){ var u2=(T-0.375)/0.09; s=1-u2; x=-sideShift*u2; }
        else { s=0; x=-sideShift; }
      }
      else if(o===2){
        if(T < 0.395){ s=0; x=sideShift; }
        else if(T < 0.475){ var u3=(T-0.395)/0.08; s=u3; x=sideShift*(1-u3); }
        else if(T < 0.645){ s=1; x=0; }
        else if(T < 0.745){ var u4=(T-0.645)/0.10; s=1-u4; x=sideShift*0.5*u4; }
        else { s=0; x=sideShift*0.5; }
      }
      else {
        y=belowShift;
        if(T < 0.665){ s=0; }
        else if(T < 0.775){ var u5=(T-0.665)/0.11; s=u5; y=belowShift*(1-u5); }
        else { s=1; y=0; }
      }
      el.style.opacity    = String(s);
      el.style.visibility = s > .01 ? 'visible' : 'hidden';
      el.style.transform  = 'translate3d(' + x + 'px,' + y + 'px,0)';
    });
  }

  l.addEventListener('seeked', function(){ pending=false; if(Math.abs(l.currentTime-target)>.02) seek(); });
  function seek(){ if(pending||Math.abs(l.currentTime-target)<=.02) return; pending=true; try{ l.currentTime=target; }catch(e){ pending=false; } }
  function U(){ if(!S||!q) return; target = T*Math.max(.001, q-.05); seek(); }

  function _(){ j(); z(); U(); F=false; }
  function N(){ F||(F=true, requestAnimationFrame(_)); }
  addEventListener('scroll', N, {passive:true});
  addEventListener('resize', N, {passive:true});

  j(); T=0; z();
  d[0].style.opacity='1'; d[0].style.visibility='visible'; d[0].style.transform='translate3d(0,0,0)';
})();
</script>
</body>
</html>
