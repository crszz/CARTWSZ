<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalet Suizo</title>
<meta name="theme-color" content="#0A1C16">
<style>
*,::after,::before{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;padding:0;width:100%;max-width:100%;
  overflow-x:hidden;
  background:#050609;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
video{display:block;max-width:100%}

/* ============================================================
   SCROLL VIDEO
   ============================================================ */
.scrolly{
  --story-height:250vh;
  position:relative;width:100%;
  height:var(--story-height);
  background:#050609;
}
.scrolly__sticky{
  position:sticky;top:0;
  width:100%;height:100vh;height:100svh;height:100dvh;
  min-height:0;overflow:hidden;
  isolation:isolate;background:#050609;
}
.scrolly__media{
  position:absolute;inset:0;z-index:-2;
  overflow:hidden;background:#050609;pointer-events:none;
}
.scrolly__video{
  position:absolute;inset:0;
  width:100%;height:100%;
  max-width:none;object-fit:cover;
  transform:translate3d(0,0,0) scale(1.015);
  backface-visibility:hidden;
  background:#050609;pointer-events:none;
}
.scrolly__sticky::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(5,6,9,.34),rgba(5,6,9,.08) 56%,rgba(5,6,9,.24)),
    linear-gradient(180deg,rgba(5,6,9,.12),transparent 24%,transparent 70%,rgba(5,6,9,.28));
}

.scrolly__content{position:relative;width:100%;height:100%}
.scrolly__scene{
  position:absolute;inset:0;
  opacity:0;visibility:hidden;
  pointer-events:none;
}

/* ============================================================
   CÍRCULO NEGRO — emerge del centro al FINAL del video scroll
   ============================================================ */
.circle-reveal{
  position:absolute;inset:0;
  background:#000;
  z-index:50;
  pointer-events:none;
  clip-path:circle(0% at 50% 50%);
  -webkit-clip-path:circle(0% at 50% 50%);
  will-change:clip-path;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>

<section class="scrolly" id="inicio" aria-label="Video scroll">
  <div class="scrolly__sticky">

    <div class="scrolly__media" aria-hidden="true">
      <video id="scrollyVideo" class="scrolly__video" muted playsinline preload="metadata">
        <source src="https://organicbionatural.com/wp-content/uploads/2026/10/Scroll2.mp4" type="video/mp4">
      </video>
    </div>

    <div class="scrolly__content">
      <div class="scrolly__scene" data-scene="0"></div>
      <div class="scrolly__scene" data-scene="1"></div>
      <div class="scrolly__scene" data-scene="2"></div>
      <div class="scrolly__scene" data-scene="3"></div>
    </div>

    <div class="circle-reveal" id="circleReveal" aria-hidden="true"></div>

  </div>
</section>

<script>
(function(){
  'use strict';
  var n = function(v,a,b){return Math.max(a,Math.min(b,v))};
  var c = document.querySelector('.scrolly');
  var l = document.getElementById('scrollyVideo');
  var circle = document.getElementById('circleReveal');
  if(!c||!l) return;

  var q=0, S=false, T=0, F=false, pending=false, target=0;

  function Y(){ q = Number.isFinite(l.duration)?l.duration:0; S=q>0 && l.readyState>=1; }
  l.addEventListener('loadedmetadata', function(){ Y(); try{ l.pause(); l.currentTime=0; }catch(e){} }, {once:true});
  l.addEventListener('durationchange', Y);
  l.addEventListener('loadeddata', Y);
  l.addEventListener('canplay', Y);
  try{ l.load(); }catch(e){}

  function j(){
    var r = c.getBoundingClientRect();
    var m = Math.max(1, c.offsetHeight - innerHeight);
    T = n(-r.top / m, 0, 1);
  }

  function z(){
    if(!circle) return;

    /* startP = 0.95 → el círculo espera hasta el final real del scroll.
       El scroll termina en T=1.0 → aquí el círculo ya cubre toda la página.
       (Antes empezaba en 0.90 → se adelantaba ~5 "frames" del scroll antes de tiempo). */
    var startP = 0.95;
    var endP   = 1.00;

    var p = n((T - startP) / (endP - startP), 0, 1);

    /* Ease-in-out cúbica: entra sutil y aterriza suave, sin saltos bruscos */
    var e = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;

    /* 71% ya toca la esquina; 110% da margen seguro para cualquier viewport */
    var radius = (e * 110).toFixed(2);
    var cp = 'circle(' + radius + '% at 50% 50%)';
    circle.style.clipPath = cp;
    circle.style.webkitClipPath = cp;
  }

  l.addEventListener('seeked', function(){ pending=false; if(Math.abs(l.currentTime-target)>.02) seek(); });
  function seek(){ if(pending||Math.abs(l.currentTime-target)<=.02) return; pending=true; try{ l.currentTime=target; }catch(e){ pending=false; } }
  function U(){ if(!S||!q) return; target = T*Math.max(.001, q-.05); seek(); }

  function _(){ j(); z(); U(); F=false; }
  function N(){ F||(F=true, requestAnimationFrame(_)); }
  addEventListener('scroll', N, {passive:true});
  addEventListener('resize', N, {passive:true});

  j(); T=0; z();
})();
</script>
</body>
</html>
