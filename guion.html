<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scroll Canvas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #111; }
  body { height: 400vh; overflow-x: hidden; }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 0;
    display: block;
  }

  .hint {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
    z-index: 20;
    pointer-events: none;
  }

  .status {
    position: fixed;
    top: 10px; left: 10px;
    color: #0f0;
    font-family: monospace;
    font-size: 11px;
    z-index: 30;
    background: rgba(0,0,0,0.75);
    padding: 6px 10px;
    border-radius: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="hint">Desliza para explorar</div>
<div class="status" id="status">⏳ Cargando frames...</div>

<script>
(() => {
  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d');
  const statusEl = document.getElementById('status');

  // ⚙️ CONFIGURA AQUÍ
  const FRAME_COUNT = 300;        // total de imágenes generadas (mira cuántos archivos hay en /frames)
  const FRAME_PATH  = 'frames/frame_'; // ruta base
  const FRAME_EXT   = '.jpg';
  const PAD         = 4;          // ceros de relleno: frame_0001.jpg = 4

  const images = new Array(FRAME_COUNT);
  let loaded = 0;
  let currentFrame = -1;

  // Ajustar canvas a pantalla
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = window.innerWidth  * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width  = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(dpr, dpr);
    // Repintar el frame actual
    if (currentFrame >= 0 && images[currentFrame]) drawFrame(currentFrame);
  };
  window.addEventListener('resize', resize);

  const pad = (n, len) => String(n).padStart(len, '0');

  const drawFrame = (i) => {
    const img = images[i];
    if (!img || !img.complete) return;
    // object-fit: cover manual
    const cw = window.innerWidth;
    const ch = window.innerHeight;
    const ir = img.width / img.height;
    const cr = cw / ch;
    let w, h, x, y;
    if (ir > cr) {
      h = ch; w = h * ir;
      x = (cw - w) / 2; y = 0;
    } else {
      w = cw; h = w / ir;
      x = 0; y = (ch - h) / 2;
    }
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, x, y, w, h);
    currentFrame = i;
  };

  // Cargar TODAS las imágenes de una vez (se cachean en el navegador)
  for (let i = 0; i < FRAME_COUNT; i++) {
    const img = new Image();
    img.src = FRAME_PATH + pad(i + 1, PAD) + FRAME_EXT;
    img.onload = () => {
      loaded++;
      statusEl.textContent = `⏳ ${loaded}/${FRAME_COUNT}`;
      if (i === 0) drawFrame(0); // pintar el primero cuanto antes
      if (loaded === FRAME_COUNT) {
        statusEl.textContent = '✅ Listo. Desliza';
        setTimeout(() => statusEl.style.display = 'none', 2000);
      }
    };
    img.onerror = () => {
      statusEl.textContent = `❌ Error en frame ${i + 1}`;
      statusEl.style.color = '#f44';
    };
    images[i] = img;
  }

  resize();

  // ------- SCROLL -------
  const setFromScroll = () => {
    const max = document.body.scrollHeight - window.innerHeight;
    if (max <= 0) return;
    const pct = Math.min(1, Math.max(0, window.scrollY / max));
    const frame = Math.round(pct * (FRAME_COUNT - 1));
    if (frame !== currentFrame) drawFrame(frame);
  };

  window.addEventListener('scroll', () => {
    window.requestAnimationFrame(setFromScroll);
  }, { passive: true });

  // ------- TÁCTIL (arrastre directo) -------
  let startY = 0, startScroll = 0, dragging = false;

  document.addEventListener('touchstart', (e) => {
    dragging = true;
    startY = e.touches[0].clientY;
    startScroll = window.scrollY;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const delta = startY - e.touches[0].clientY;
    const max = document.body.scrollHeight - window.innerHeight;
    window.scrollTo(0, Math.max(0, Math.min(max, startScroll + delta)));
  }, { passive: true });

  document.addEventListener('touchend', () => { dragging = false; });
})();
</script>
</body>
</html>
