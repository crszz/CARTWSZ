<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scroll Video Táctil</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Fondo negro SOLO en html (fallback), no en body */
        html {
            background: #000;
        }

        body {
            height: 400vh;
            overflow-x: hidden;
            /* ⚠️ SIN background aquí (era el que tapaba el video) */
        }

        .video-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: 0;              /* ✅ CAMBIO: era -1 */
            background: #111;        /* color visible mientras carga */
        }

        #scroll-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
        }

        .touch-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100vh;
            z-index: 10;
            touch-action: none;
        }

        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
            z-index: 20;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }

        /* Panel de debug — bórralo cuando ya funcione */
        .status {
            position: fixed;
            top: 10px; left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border-radius: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video 
            id="scroll-video" 
            src="https://organicbionatural.com/wp-content/uploads/2026/10/Scroll2.mp4" 
            muted 
            playsinline 
            preload="auto"
            disablepictureinpicture>
        </video>
    </div>

    <div class="touch-layer" id="touch-layer"></div>
    <div class="hint">Desliza para explorar</div>
    <div class="status" id="status">⏳ Cargando video...</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video      = document.getElementById('scroll-video');
            const touchLayer = document.getElementById('touch-layer');
            const statusEl   = document.getElementById('status');

            let isDragging    = false;
            let startY        = 0;
            let startVideoTime = 0;
            const sensitivity = 300;
            let videoReady    = false;

            // ---------------------------------------------
            // ESTADO DEL VIDEO (para debug visual)
            // ---------------------------------------------
            video.addEventListener('loadstart', () => {
                statusEl.textContent = '⏳ Conectando con el video...';
            });

            video.addEventListener('loadedmetadata', () => {
                statusEl.textContent = `✅ Metadata OK\nDuración: ${video.duration.toFixed(2)}s`;
            });

            video.addEventListener('loadeddata', () => {
                // Fuerza el render del primer frame
                video.currentTime = 0.001;
                videoReady = true;
                statusEl.textContent = `✅ Video listo\nDuración: ${video.duration.toFixed(2)}s`;
                setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
            });

            video.addEventListener('error', () => {
                const err = video.error;
                const codes = {
                    1: 'Carga abortada',
                    2: 'Error de red',
                    3: 'Error de decodificación',
                    4: 'Formato no soportado / URL inválida (404)'
                };
                statusEl.innerHTML = `❌ ${codes[err?.code] || 'Error desconocido'}<br>Código: ${err?.code}`;
                statusEl.style.color = '#f44';
            });

            // ---------------------------------------------
            // ACTUALIZAR TIEMPO DEL VIDEO
            // ---------------------------------------------
            const updateVideoTime = (deltaY) => {
                if (!videoReady) return;
                const timeDelta = (deltaY / sensitivity) * video.duration;
                let newTime = startVideoTime - timeDelta;
                newTime = Math.max(0, Math.min(newTime, video.duration - 0.01));
                video.currentTime = newTime;
            };

            // ---------------------------------------------
            // EVENTOS TÁCTILES (MÓVIL)
            // ---------------------------------------------
            touchLayer.addEventListener('touchstart', (e) => {
                if (!videoReady) return;
                isDragging = true;
                startY = e.touches[0].clientY;
                startVideoTime = video.currentTime;
                video.pause();
            }, { passive: true });

            touchLayer.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                updateVideoTime(e.touches[0].clientY - startY);
            }, { passive: false });

            touchLayer.addEventListener('touchend',    () => { isDragging = false; });
            touchLayer.addEventListener('touchcancel', () => { isDragging = false; });

            // ---------------------------------------------
            // EVENTOS DE RATÓN (ESCRITORIO)
            // ---------------------------------------------
            touchLayer.addEventListener('mousedown', (e) => {
                if (!videoReady) return;
                isDragging = true;
                startY = e.clientY;
                startVideoTime = video.currentTime;
                video.pause();
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                updateVideoTime(e.clientY - startY);
            });

            document.addEventListener('mouseup', () => { isDragging = false; });

            // ---------------------------------------------
            // SCROLL CON RUEDA (fallback)
            // ---------------------------------------------
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (isDragging || !videoReady) return;
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const scrollMax = document.body.scrollHeight - window.innerHeight;
                        const pct = window.scrollY / scrollMax;
                        const target = pct * (video.duration - 0.01);
                        video.currentTime += (target - video.currentTime) * 0.15;
                        ticking = false;
                    });
                    ticking = true;
                }
            });

            document.body.style.overscrollBehavior = 'none';
        });
    </script>
</body>
</html>
